[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-synthetic-pipeline"
version = "0.1.0"
description = "Data-only synthetic generation, filtering, evaluation, and prompt/mixture optimization loop"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
data = [
  "pandas>=2.0,<3",
  "pyarrow>=12,<20",
]
math = ["sympy>=1.12,<2"]
dev = ["pytest>=7,<9"]

[project.scripts]
dsp-data = "data_synthetic_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

